# Mapa de camaras para los "viajes" (seguimiento entre camaras). Editable; se relee al reiniciar.
# Una visita se enlaza a un viaje si empieza poco despues de que termino otra en una camara conectada.
building:            # camaras dentro del inmueble (todas conectadas entre si)
  - cam-228          # Garage frontal (entrada peatonal)
  - cam-120          # Acceso Site
  - cam-215          # Cocina
  - cam-113          # Escaleras entrada
  - cam-236          # Escaleras P2
  - cam-sala-juntas
  - cam-cowork
  - cam-118          # Garage posterior
street:              # calle y videoportero (conectadas con las de entrada)
  - cam-vto
  - cam-189
  - cam-191
entry_cams: [cam-228, cam-vto]         # un viaje nuevo que empieza aqui es una entrada
tuya_entries:                          # aviso (camara Tuya o sensor) -> camara de thor-vision a la que anticipa
  tuya-garaje: [cam-236, cam-113, cam-228]   # esa Tuya apunta a las escaleras: la persona aparece en las de arriba o abajo, o llega al garage
  tuya-escaleras-p2: [cam-236, cam-113]  # camara Tuya de las escaleras del segundo piso
  door-recepcion: cam-113              # puerta de cristal de la recepcion: inicia el viaje de Escaleras entrada
  door-comedor: cam-215                # puerta del comedor: entrada a la Cocina (pasa antes por la Tuya del jardin)
  garage-abre: cam-228                 # abre-puertas del garage
max_gap_s: 180                         # tiempo maximo entre una camara y la siguiente
fragment_gap_s: 30                     # misma camara: visitas partidas de la misma persona
tuya_window_s: 60                      # tras un movimiento de la Tuya se espera una visita en la camara de entrada
trips:                                 # viajes disparados por un evento: se registra TODO el recorrido (entrada: calle > garage > escaleras/Site; salida: al reves)
  window_s: 300
  triggers:
    garage-abre:                       # portón completo del garage (Tuya): entra o sale un vehículo o alguien con él. La puerta peatonal café la abre SALTO KS (pendiente de integrar)
      label: "Se abrió el portón del garage"
      cams: [cam-189, cam-191, cam-228, cam-118, cam-236, cam-113, cam-120]
      inner: [cam-228, cam-118, cam-236, cam-113, cam-120]
      window_s: 420
    vto-timbre:                        # alguien toco el timbre del videoportero (evento nativo del Dahua): se sigue hacia adentro; sin entrada no se alerta
      label: "Tocaron el timbre del videoportero"
      cams: [cam-vto, cam-120, cam-113, cam-228, cam-236]
      inner: [cam-120, cam-113, cam-228, cam-236]
      window_s: 300
      entry_gap_s: 300                 # quien toca espera a que le abran: puede aparecer en Garage frontal varios minutos despues
      min_gap_s: 90                    # Invite y CallNoAnswered del mismo timbrazo abren un solo viaje
      quiet_if_empty: true
door_links:                            # camara de la puerta -> camara donde aparece quien entra por ella (une sus visitas en un mismo recorrido)
  cam-vto: [cam-228]
door_link_s: 240                       # quien sale del videoportero aparece en la de entrada a lo mucho tanto despues
door_min_s: 15                         # solo visitas al videoportero de al menos tanto (los que pasan de largo no entran)
