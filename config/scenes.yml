# Contexto de escena por camara para el VLM (Qwen). Se inyecta en el prompt.
# Editable sin tocar cameras.yml; se relee al reiniciar thor-vision.
#
# Campos por camara:
#   where        donde esta y que ve (hechos verificables en la imagen)
#   focus        lo que SI importa reportar aqui
#   ignore       lo que es normal/ruido y NO debe generar alerta
#   alert_types  codigos de alerta permitidos en esta camara (del catalogo)
#   night_person "alert" = cualquier persona en horario nocturno es alerta;
#                "note"  = solo se anota, sin alerta
#   vehicles     true si contar/describir vehiculos aporta valor

night_hours: [22, 6]   # horario nocturno local (inicio, fin)

# Mascotas de la casa: el VLM las reconoce y no genera alerta "animal" por ellas.
known_pets:
  - Mojo-jojo (perro negro pequeno)
  - Akamaru (shiba inu cafe, el papa)
  - Gigi (shar pei, mas grande que Akamaru)

alert_catalog:
  persona_en_suelo:        "persona caida, tirada o inmovil en el piso"
  acceso_no_autorizado:    "persona entrando o intentando entrar a una zona restringida o forzando una puerta/reja"
  merodeo:                 "persona que se detiene frente al muro/reja/puerta del inmueble, mira hacia adentro o vuelve a pasar; caminar de paso NO es merodeo"
  persona_nocturna:        "presencia de persona en horario nocturno en un area que deberia estar vacia"
  vehiculo_detenido:       "vehiculo que se detiene, estaciona o permanece frente al acceso"
  manipulacion_vehiculo:   "persona forzando o abriendo un vehiculo que no es suyo (recargarse o rozarlo NO cuenta)"
  grupo_inusual:           "grupo de 3 o mas personas donde normalmente hay 0-1"
  objeto_abandonado:       "paquete, bolsa o bulto dejado sin dueno visible"
  fuego_humo:              "fuego, humo o chispas"
  puerta_abierta:          "puerta, porton o reja que deberia estar cerrada aparece abierta"
  animal:                  "animal (perro, gato, etc.) dentro de un area interior que NO es una de las mascotas conocidas"
  uso_telefono_exterior:   "persona en el exterior (calle, banqueta, moto o auto estacionado) mirando o usando su telefono celular"

cameras:
  cam-189:
    name: Exterior 1
    toma: "Cámara alta sobre el muro del inmueble, gran angular de 5 MP, mira en diagonal calle abajo."
    zonas:
      - "izquierda: muro naranja del propio inmueble con rejas; abajo a la izquierda está la puerta peatonal"
      - "centro: banqueta ancha con jardinera y un árbol"
      - "derecha y fondo: calle con autos estacionados en ambos lados, árboles y casas de enfrente"
    flujo: "Los peatones recorren la banqueta en ambos sentidos; quien se pega al muro de la izquierda o se detiene ahí va o mira hacia la puerta peatonal. Los autos circulan por la calle a la derecha. Exterior 2 ve el mismo tramo desde el otro lado: una persona que pasa aparece en las dos."
    where: >
      Exterior, banqueta y calle frente al inmueble vistas desde arriba en
      diagonal. A la izquierda un muro con rejas del propio inmueble y un
      farol muy brillante; al fondo arboles y autos estacionados en la calle.
      Imagen infrarroja/nocturna con ruido en la noche.
    focus:
      - persona de pie, sentada o sobre una moto/auto que mira o usa su telefono celular (alerta uso_telefono_exterior, severidad low)
      - personas que caminan pegadas al muro/rejas del inmueble o se detienen frente a el
      - personas que vuelven a pasar o observan (merodeo)
      - vehiculos que se detienen frente al inmueble o se estacionan y quedan con gente adentro
      - personas que intentan abrir o forzan un vehiculo estacionado
    ignore:
      - personas que se recargan, se apoyan o pasan la mano por un auto estacionado sin abrirlo
      - transeuntes que caminan pegados al muro sin detenerse
      - autos ya estacionados que no se mueven
      - transeuntes que solo cruzan de lado a lado sin detenerse
      - destellos del farol, reflejos, hojas, sombras de arboles, ruido infrarrojo
    alert_types: [merodeo, acceso_no_autorizado, vehiculo_detenido, manipulacion_vehiculo, grupo_inusual, fuego_humo, uso_telefono_exterior]
    night_person: note
    vehicles: true

  cam-191:
    name: Exterior 2
    toma: "Cámara alta sobre el muro del inmueble, gran angular de 5 MP, mira la misma banqueta en sentido contrario a Exterior 1."
    zonas:
      - "derecha: muro del propio inmueble con rejas; abajo a la derecha, la zona de la puerta peatonal"
      - "centro: banqueta ancha"
      - "izquierda: calle con autos estacionados"
      - "fondo: casas y portón de un vecino, esquina"
    flujo: "Peatones en ambos sentidos por la banqueta; detenerse junto al muro de la derecha es acercarse al inmueble. Mismo tramo que Exterior 1."
    where: >
      Exterior, la misma banqueta y calle que Exterior 1 desde otro angulo:
      calle a la izquierda, banqueta amplia al centro, muro con rejas del
      inmueble a la derecha, cochera/porton de un vecino al fondo.
    focus:
      - persona de pie, sentada o sobre una moto/auto que mira o usa su telefono celular (alerta uso_telefono_exterior, severidad low)
      - personas que caminan pegadas al muro/rejas del inmueble o se detienen
      - merodeo (pasar varias veces, mirar hacia adentro, probar la reja)
      - vehiculos que se detienen o se estacionan frente al inmueble
    ignore:
      - personas que se recargan, se apoyan o pasan la mano por un auto estacionado sin abrirlo
      - transeuntes que caminan pegados al muro sin detenerse
      - autos ya estacionados, transeuntes de paso, reflejos, hojas, sombras, ruido infrarrojo
    alert_types: [merodeo, acceso_no_autorizado, vehiculo_detenido, manipulacion_vehiculo, grupo_inusual, fuego_humo, uso_telefono_exterior]
    night_person: note
    vehicles: true

  cam-113:
    name: Escaleras entrada
    toma: "Cámara montada de lado: la imagen sale vertical. Mira el recibidor desde arriba."
    zonas:
      - "recibidor con jardineras, plantas y el logo de OXM"
      - "puerta de cristal de la recepción hacia la calle"
      - "escalera de madera que sube al piso 1"
    flujo: "Quien llega de la calle entra por la puerta de cristal y sube la escalera; quien sale baja y cruza la puerta."
    where: >
      Interior, recibidor de entrada con el logo de OXM tech en la pared,
      una palmera, jardineras y la escalera de madera que sube. La camara
      esta montada rotada: la imagen sale de lado (vertical 1080x1920);
      interpreta la escena aunque se vea girada.
    focus:
      - es la PUERTA PRINCIPAL del inmueble: persona que llega y espera, mira hacia adentro o intenta abrir (merodeo)
      - cualquier persona que entra, sube o baja por la escalera
      - persona caida o tirada en escalones o piso
    ignore:
      - la palmera y objetos decorativos, luces de emergencia, ruido por poca luz
    alert_types: [persona_en_suelo, acceso_no_autorizado, persona_nocturna, objeto_abandonado, fuego_humo, puerta_abierta, merodeo]
    night_person: alert
    weekend_mode: alert_all             # actividad en fin de semana es alerta
    known_exempt: [merodeo, persona_nocturna, acceso_no_autorizado]   # solo desconocidos
    vehicles: false

  cam-sala-juntas:
    name: Sala de Juntas
    toma: "Cámara alta en esquina, gran angular."
    zonas:
      - "centro e izquierda: mesa de juntas con sillas"
      - "derecha: sofá en L (zona de descanso)"
      - "fondo: escalera y ventanal"
    flujo: "Reuniones en la mesa y descanso en el sofá; sillas y cojines vacíos no son personas."
    where: >
      Interior, sala de juntas con mesa de reuniones y sillas. Uso esperado:
      reuniones y trabajo del personal, a veces hasta tarde entre semana.
      Sillas vacias no son personas.
    focus:
      - cuantas personas hay y si estan en reunion, de pie o de paso
      - la sala ocupada fuera de horario laboral
      - objetos o equipo que aparecen o desaparecen
    ignore:
      - pantallas encendidas, sillas vacias, reflejos de ventanas
    alert_types: [persona_nocturna, acceso_no_autorizado, objeto_abandonado, persona_en_suelo, fuego_humo]
    night_person: alert
    night_hours: [0, 24]    # MODO ALERTA TOTAL (2026-10-09): cualquier persona a cualquier hora es alerta. Para volver: weekday_night: [0, 6] y weekend_mode: note
    weekend_mode: alert_all
    vehicles: false

  cam-118:
    name: Garage posterior
    toma: "Cámara alta dentro de la cochera posterior, mira el auto blanco estacionado y el portón al fondo."
    zonas:
      - "centro: auto blanco estacionado"
      - "izquierda: lockers amarillos, tarimas, bicicletas y una moto"
      - "fondo derecho: portón a la calle (entra luz fuerte)"
    flujo: "Las personas entran o salen por el portón del fondo a la derecha y caminan junto al auto. Manipular el auto o los objetos guardados es lo que importa."
    where: >
      Interior, cochera cerrada con un auto blanco estacionado en el centro,
      bicicleta/moto y objetos guardados a la izquierda, pared a la derecha.
      Imagen infrarroja en blanco y negro.
    focus:
      - cualquier persona que entra a la cochera o se acerca al auto
      - persona tocando o abriendo el vehiculo o las puertas
      - el auto se mueve, sale o llega otro
      - objetos que aparecen o desaparecen de los lados
    ignore:
      - el auto blanco y los objetos guardados estaticos, ruido infrarrojo, reflejos en la pared
    alert_types: [manipulacion_vehiculo, acceso_no_autorizado, persona_nocturna, objeto_abandonado, persona_en_suelo, fuego_humo, animal]
    night_person: alert
    known_exempt: [acceso_no_autorizado, persona_nocturna, manipulacion_vehiculo]   # solo desconocidos
    vehicles: true

  cam-228:
    name: Garage frontal
    toma: "Cámara alta dentro de la cochera frontal, mira la parte trasera del auto estacionado hacia la escalera de acceso."
    zonas:
      - "izquierda y centro: auto plateado estacionado"
      - "derecha: pared de piedra con extintor, señalización y una bicicleta"
      - "arriba a la derecha: escalones que suben al interior"
    flujo: "Quien entra por el portón cruza junto al auto y sube los escalones de la derecha; quien sale baja por ahí hacia el portón. De noche la imagen es casi negra."
    where: >
      Interior, cochera frontal techada: auto plateado estacionado, pared de piedra con extintor y una bicicleta, escalones de acceso al interior. De noche sin luz la imagen es casi negra con tinte azul y puede no haber informacion.
    focus:
      - personas o vehiculos que entran o salen por el acceso
      - persona parada frente al porton o forzandolo
    ignore:
      - oscuridad, ruido de imagen, puntos de luz aislados
    alert_types: [acceso_no_autorizado, manipulacion_vehiculo, persona_nocturna, vehiculo_detenido, puerta_abierta, fuego_humo]
    night_person: alert
    known_exempt: [acceso_no_autorizado, persona_nocturna, manipulacion_vehiculo]   # solo desconocidos
    vehicles: true

  cam-120:
    name: Acceso Site
    toma: "Cámara alta en esquina, mira una sala pequeña que da al cuarto de site."
    zonas:
      - "izquierda: puerta negra"
      - "centro: sillón, cuadro pop-art y extintor"
      - "derecha: puerta de cristal 'ALMACÉN' que lleva al site"
    flujo: "Las mascotas pasan seguido por aquí. Cruzar la puerta de cristal de la derecha es entrar al site (equipo de red)."
    where: >
      Interior, sala pequena antes del cuarto de site (equipo de red): sillon, cuadro pop-art, puerta negra y puerta de cristal ALMACEN hacia el site. De noche casi negra, solo luces de equipos.
    focus:
      - CUALQUIER persona frente a la puerta o dentro del site es alerta acceso_no_autorizado, a cualquier hora
      - la puerta abierta o alguien manipulando equipos
    ignore:
      - los LEDs de los equipos y el ruido por poca luz
    alert_types: [acceso_no_autorizado, persona_nocturna, puerta_abierta, objeto_abandonado, fuego_humo]
    night_person: alert
    known_exempt: [acceso_no_autorizado, puerta_abierta]   # el personal identificado entra al site sin alerta; los desconocidos si
    vehicles: false

  cam-215:
    name: Cocina-Patio
    toma: "Cámara alta en esquina de la cocina, gran angular."
    zonas:
      - "izquierda: refrigerador con imanes"
      - "fondo: cocina integral con estufa y fregadero"
      - "derecha: puerta corrediza de vidrio al patio con plantas"
      - "frente: mesa redonda de vidrio con sillas"
    flujo: "La puerta corrediza de la derecha conecta la cocina con el patio (sensor 'Puerta Comedor'); las mascotas entran y salen por ahí."
    where: >
      Interior, cocina con refrigerador con imanes a la izquierda, mesa con
      sillas al centro y una puerta corrediza de vidrio hacia un patio con
      plantas a la derecha/fondo. Desde aqui tambien se ve el patio exterior.
    focus:
      - personas en la cocina o cruzando al patio, y que hacen (cocinar, comer, de paso)
      - persona en el patio en la noche
      - animales dentro de la cocina
      - persona caida en el piso
    ignore:
      - plantas movidas por el viento en el patio, reflejos en el vidrio, luces del refrigerador
    alert_types: [persona_nocturna, persona_en_suelo, animal, fuego_humo, acceso_no_autorizado]
    night_person: alert
    night_hours: [0, 7]                 # alerta de 00:00 a 07:00
    known_exempt: [persona_nocturna]    # personas conocidas en cuadro no generan alerta nocturna
    vehicles: false

  cam-cowork:
    name: Cowork
    toma: "Cámara alta en esquina del cowork del piso 1, gran angular."
    zonas:
      - "izquierda: escritorios con monitores"
      - "primer plano: escritorio en L"
      - "centro y derecha: escalera de madera y ventanales al fondo"
    flujo: "Trabajo en escritorios en horario laboral; la escalera conecta con los otros pisos."
    where: >
      Interior, area de coworking del piso 1 con escritorios y monitores,
      puerta/ventanal de vidrio al fondo. Uso esperado: trabajo en horario laboral.
    focus:
      - cuantas personas hay y si trabajan sentadas, conversan o solo pasan
      - personas fuera de horario laboral
      - personas en la puerta de vidrio entrando o saliendo
    ignore:
      - monitores encendidos, luces de standby, reflejos del vidrio
    alert_types: [persona_nocturna, acceso_no_autorizado, objeto_abandonado, persona_en_suelo, fuego_humo]
    night_person: alert
    night_hours: [0, 24]    # MODO ALERTA TOTAL (2026-10-09): cualquier persona a cualquier hora es alerta. Para volver, borra esta linea
    weekend_mode: alert_all
    vehicles: false

  cam-236:
    name: Escaleras P2
    toma: "Cámara alta en el piso 2, mira el descanso y la escalera desde arriba."
    zonas:
      - "centro y abajo: escalera con barandal de vidrio y escalones de madera"
      - "derecha: ventanal grande y una planta"
      - "izquierda: pasillo con un mueble y un jarrón"
    flujo: "Las personas suben o bajan por la escalera; quien se queda en el descanso o el pasillo de noche no es tránsito normal."
    where: >
      Interior, escalera y descanso del piso 2. En la noche la imagen es
      casi negra; de dia es un pasillo/escalera de transito.
    focus:
      - personas que suben o bajan, y si alguien se detiene o se queda
      - persona caida o tirada en escalones o piso
    ignore:
      - oscuridad, ruido de imagen, puntos de luz aislados
    alert_types: [persona_en_suelo, persona_nocturna, objeto_abandonado, acceso_no_autorizado, fuego_humo]
    night_person: alert
    vehicles: false
  cam-vto:
    name: Videoportero
    where: >
      Exterior, frente al acceso peatonal del inmueble: el videoportero Dahua (VTO) en la reja.
    toma: "Cámara del videoportero, a la altura de la cara, vista a través de la reja del inmueble (dos barrotes en primer plano)."
    zonas:
      - "primer plano: barrotes de la reja"
      - "atrás: banqueta, autos estacionados y casas de enfrente"
      - "quien toca el timbre aparece muy cerca, al centro o a la derecha"
    flujo: "Quien se queda frente al videoportero espera que le abran (visita); quien pasa de largo es tráfico de la calle."
    focus:
      - persona que se queda frente al timbre o toca (visita)
      - persona que intenta abrir la reja o se queda mirando hacia adentro
      - entrega de paquetes o bultos dejados junto a la reja
    ignore:
      - transeuntes que pasan sin detenerse
      - autos que circulan o ya estacionados
    alert_types: [merodeo, acceso_no_autorizado, objeto_abandonado, fuego_humo]
    night_person: note
