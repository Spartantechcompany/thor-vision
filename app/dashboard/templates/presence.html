<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Presencia</title>
<style>
:root{--bg:#0e1117;--card:#161b22;--line:#2a3140;--tx:#e8edf3;--mut:#8b96a8;--g:#76B900;--w:#e0a030}
body{margin:0;background:var(--bg);color:var(--tx);font:14px system-ui,sans-serif;padding:16px}
h1{font-size:18px;margin:0 0 12px}h2{font-size:14px;margin:0 0 8px;color:var(--mut);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px}
.row{display:flex;justify-content:space-between;gap:8px;padding:7px 0;border-bottom:1px solid var(--line)}.row:last-child{border:0}
.mut{color:var(--mut);font-size:12px}.on{color:var(--g);font-weight:600}.off{color:var(--mut)}.warn{color:var(--w)}
.tot{display:flex;gap:18px;margin-bottom:14px;flex-wrap:wrap}.tot b{font-size:22px;display:block}
</style></head><body>
<h1>Presencia ahora</h1>
<div class="tot" id="tot"></div>
<div class="grid">
  <div class="card"><h2>Empleados</h2><div id="emp"></div></div>
  <div class="card"><h2>Invitados de hoy</h2><div id="gst"></div></div>
  <div class="card"><h2>Mascotas</h2><div id="pet"></div></div>
</div>
<script>
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const hm = t => t ? new Date(t * 1000).toLocaleTimeString('es-MX', {hour: '2-digit', minute: '2-digit', hour12: false}) : '—';
const ago = s => s == null ? '—' : s < 90 ? 'ahora' : s < 5400 ? `hace ${Math.round(s / 60)} min` : s < 172800 ? `hace ${Math.round(s / 3600)} h` : `hace ${Math.round(s / 86400)} d`;
async function load(){
  const d = await (await fetch('/api/presence/now')).json();
  document.getElementById('tot').innerHTML = `<div><b>${d.counts.in_office}/${d.counts.employees}</b><span class="mut">empleados en oficina</span></div>
    <div><b>${d.counts.guests_now}</b><span class="mut">invitados ahora</span></div><div><b>${d.counts.pets_home}/${d.pets.length}</b><span class="mut">mascotas en casa</span></div>`;
  document.getElementById('emp').innerHTML = d.employees.map(e => `<div class="row"><div>${esc(e.name)}<div class="mut">${e.by_camera ? 'cámara' : ''}${e.by_camera && e.by_wifi ? ' + ' : ''}${e.by_wifi ? 'WiFi' : ''}${!e.by_camera && !e.by_wifi ? 'última vez ' + hm(e.last_ts) : ''}${e.alert ? ' · <span class="warn">' + esc(e.alert) + '</span>' : ''}</div></div>
    <div style="text-align:right"><span class="${e.status === 'en oficina' ? 'on' : 'off'}">${esc(e.status)}</span><div class="mut">${hm(e.first_ts)} – ${hm(e.last_ts)} · ${e.minutes} min</div></div></div>`).join('') || '<span class="mut">Sin empleados registrados</span>';
  document.getElementById('gst').innerHTML = d.guests.map(g => `<div class="row"><div>${esc(g.name)}<div class="mut">${esc((g.cams || []).join(', '))}</div></div>
    <div style="text-align:right"><span class="${g.now ? 'on' : 'off'}">${g.now ? 'ahora' : 'ya salió'}</span><div class="mut">${hm(g.first_ts)} – ${hm(g.last_ts)}</div></div></div>`).join('') || '<span class="mut">Sin invitados hoy</span>';
  document.getElementById('pet').innerHTML = d.pets.map(p => `<div class="row"><div>${esc(p.name)}<div class="mut">${p.cam ? esc(p.cam) : ''}</div></div>
    <div style="text-align:right"><span class="${p.status === 'en casa' ? 'on' : p.status === 'fuera' ? 'warn' : 'off'}">${esc(p.status)}</span><div class="mut">${ago(p.age_s)}</div></div></div>`).join('');
}
load(); setInterval(load, 20000);
</script></body></html>
